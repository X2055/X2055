<!DOCTYPE html>

<head>

    <title>3D 模型交互展示</title>
    <style>
        /* 重置默认边距 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            background-color: #f0f2f5;
        }

        /* 页眉样式 */
        header {
            background-color: #2c3e50;
            color: #ffffff;
            text-align: center;
            padding: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        /* 主体内容区，使其占据剩余空间并居中内容 */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 3D 模型容器样式 */
        .sketchfab-embed-wrapper {
            width: 100%;
            max-width: 800px; /* 限制最大宽度，保证大屏阅读体验 */
            height: 600px;    /* 设置合适的高度 */
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 确保 iframe 填满容器的剩余空间 */
        .sketchfab-embed-wrapper iframe {
            width: 100%;
            flex: 1; /* 自动填充高度 */
            border: none;
        }

        /* 底部版权信息样式 */
        .sketchfab-embed-wrapper p {
            text-align: center;
            padding: 12px;
            background-color: #fafafa;
            margin: 0;
            border-top: 1px solid #eeeeee;
        }

        /* 页脚样式 */
        footer {
            background-color: #34495e;
            color: #bdc3c7;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>

    </header>
