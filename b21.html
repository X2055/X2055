<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 哔哩哔哩社区</title>
    <link rel="stylesheet" href="../css/b2.css">
    <link rel="stylesheet" href="../css/b3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="../b1.html" class="logo"><i class="fas fa-play-circle"></i><span>哔哩哔哩</span></a>
                <nav class="main-nav">
                    <a href="../b1.html" class="nav-item">首页</a>
                    <a href="b7.html" class="nav-item">动画</a>
                    <a href="b8.html" class="nav-item">游戏</a>
                    <a href="b9.html" class="nav-item">音乐</a>
                    <a href="b10.html" class="nav-item">舞蹈</a>
                    <a href="b11.html" class="nav-item">科技</a>
                    <a href="b12.html" class="nav-item">影视</a>
                    <a href="b13.html" class="nav-item">生活</a>
                    <a href="b14.html" class="nav-item">美食</a>
                    <a href="b15.html" class="nav-item">运动</a>
                    <a href="b16.html" class="nav-item">汽车</a>
                    <a href="b17.html" class="nav-item">动漫</a>
                    <a href="b18.html" class="nav-item">时尚</a>
                    <a href="b19.html" class="nav-item">学习</a>
                    <a href="b20.html" class="nav-item">创意</a>
                </nav>
            </div>
            <div class="nav-right">
                <div class="search-box">
                    <input type="text" placeholder="搜索你想看的内容" id="searchInput">
                    <button class="search-btn" onclick="handleSearch()"><i class="fas fa-search"></i></button>
                </div>
                <div class="user-actions" id="userActions">
                    <div class="not-logged-in" id="notLoggedIn">
                        <button class="btn-login" onclick="openModal('loginModal')">登录</button>
                        <button class="btn-register" onclick="openModal('registerModal')">注册</button>
                    </div>
                    <div class="logged-in" id="loggedIn" style="display:none;">
                        <div class="user-avatar" onclick="toggleUserMenu()">
                            <img id="userAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=default" alt="头像">
                            <span id="username-display">用户名</span>
                            <i class="fas fa-caret-down"></i>
                        </div>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="b21.html"><i class="fas fa-user"></i> 个人中心</a>
                            <a href="b22.html"><i class="fas fa-upload"></i> 投稿</a>
                            <a href="b23.html"><i class="fas fa-heart"></i> 收藏</a>
                            <a href="b24.html"><i class="fas fa-history"></i> 历史记录</a>
                            <hr><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="profile-header">
        <div class="profile-card" id="profileCard">
            <div class="profile-avatar">
                <img id="profileAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=default" alt="头像">
            </div>
            <div class="profile-info">
                <h1 id="profileName">加载中...</h1>
                <p id="profileEmail">--</p>
                <div class="profile-stats">
                    <div class="profile-stat"><div class="profile-stat-num" id="statFavorites">0</div><div class="profile-stat-label">收藏</div></div>
                    <div class="profile-stat"><div class="profile-stat-num" id="statHistory">0</div><div class="profile-stat-label">观看</div></div>
                    <div class="profile-stat"><div class="profile-stat-num" id="statVideos">0</div><div class="profile-stat-label">投稿</div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="list-container">
        <div class="section-container" style="padding:0;">
            <h2 class="section-title"><i class="fas fa-cog"></i> 账号设置</h2>
            <div style="background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> 用户名</label>
                        <input type="text" id="settingsUsername" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> 邮箱</label>
                        <input type="email" id="settingsEmail" placeholder="请输入邮箱" disabled>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-palette"></i> 头像种子（修改可换头像）</label>
                        <input type="text" id="settingsAvatar" placeholder="输入任意文字">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-key"></i> 修改密码</label>
                        <input type="password" id="settingsPassword" placeholder="留空则不修改">
                    </div>
                </div>
                <button class="btn-submit" style="margin-top:16px;width:auto;padding:12px 32px;" onclick="saveSettings()">保存设置</button>
            </div>
        </div>
    </div>

    <!-- 登录/注册模态框 -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('loginModal')"><i class="fas fa-times"></i></button>
            <div class="modal-header"><h2><i class="fas fa-sign-in-alt"></i> 登录</h2><p>登录后体验更多功能</p></div>
            <form class="auth-form" onsubmit="handleLogin(event)">
                <div class="form-group"><label><i class="fas fa-user"></i> 用户名</label><input type="text" id="loginUsername" placeholder="请输入用户名" required></div>
                <div class="form-group"><label><i class="fas fa-lock"></i> 密码</label><input type="password" id="loginPassword" placeholder="请输入密码" required></div>
                <div class="form-options"><label><input type="checkbox" id="rememberMe"> 记住我</label><a href="#">忘记密码？</a></div>
                <button type="submit" class="btn-submit">登录</button>
            </form>
            <div class="modal-footer"><p>还没有账号？<a href="#" onclick="switchModal('loginModal','registerModal')">立即注册</a></p></div>
        </div>
    </div>
    <div class="modal-overlay" id="registerModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('registerModal')"><i class="fas fa-times"></i></button>
            <div class="modal-header"><h2><i class="fas fa-user-plus"></i> 注册</h2><p>加入我们，开启精彩旅程</p></div>
            <form class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group"><label><i class="fas fa-user"></i> 用户名</label><input type="text" id="regUsername" placeholder="请输入用户名（3-16字符）" required minlength="3" maxlength="16"></div>
                <div class="form-group"><label><i class="fas fa-envelope"></i> 邮箱</label><input type="email" id="regEmail" placeholder="请输入邮箱地址" required></div>
                <div class="form-group"><label><i class="fas fa-lock"></i> 密码</label><input type="password" id="regPassword" placeholder="请输入密码（至少6位）" required minlength="6"></div>
                <div class="form-group"><label><i class="fas fa-lock"></i> 确认密码</label><input type="password" id="regPasswordConfirm" placeholder="请再次输入密码" required></div>
                <div class="form-options"><label><input type="checkbox" id="agreeTerms" required> 我已阅读并同意<a href="#">用户协议</a></label></div>
                <button type="submit" class="btn-submit">注册</button>
            </form>
            <div class="modal-footer"><p>已有账号？<a href="#" onclick="switchModal('registerModal','loginModal')">立即登录</a></p></div>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/b4.js"></script>
    <script>
        function loadProfile() {
            const user = getCurrentUser();
            if (!user) {
                showToast('请先登录', 'warning');
                setTimeout(() => openModal('loginModal'), 500);
                return;
            }
            
            // 从数据库获取完整用户信息
            const users = getUsers();
            const fullUser = users.find(u => u.id === user.id) || user;
            
            document.getElementById('profileName').textContent = fullUser.username;
            document.getElementById('profileEmail').textContent = fullUser.email;
            document.getElementById('profileAvatar').src = fullUser.avatar;
            document.getElementById('settingsUsername').value = fullUser.username;
            document.getElementById('settingsEmail').value = fullUser.email;
            document.getElementById('settingsAvatar').value = fullUser.username;
            document.getElementById('statFavorites').textContent = (fullUser.favorites || []).length;
            document.getElementById('statHistory').textContent = (fullUser.history || []).length;
        }
        
        function saveSettings() {
            const user = getCurrentUser();
            if (!user) return;
            
            const users = getUsers();
            const idx = users.findIndex(u => u.id === user.id);
            if (idx === -1) return;
            
            const newUsername = document.getElementById('settingsUsername').value.trim();
            const newAvatar = document.getElementById('settingsAvatar').value.trim();
            const newPassword = document.getElementById('settingsPassword').value;
            
            if (newUsername && newUsername !== users[idx].username) {
                if (newUsername.length < 3) {
                    showToast('用户名至少3个字符', 'error');
                    return;
                }
                if (users.some(u => u.username === newUsername && u.id !== user.id)) {
                    showToast('用户名已被占用', 'error');
                    return;
                }
                users[idx].username = newUsername;
            }
            
            if (newAvatar) {
                users[idx].avatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(newAvatar)}`;
            }
            
            if (newPassword) {
                if (newPassword.length < 6) {
                    showToast('密码至少6个字符', 'error');
                    return;
                }
                users[idx].password = newPassword;
            }
            
            saveUsers(users);
            
            // 更新session
            const sessionData = {
                id: users[idx].id,
                username: users[idx].username,
                email: users[idx].email,
                avatar: users[idx].avatar,
                loginTime: new Date().toISOString()
            };
            localStorage.setItem('bilibili_current_user', JSON.stringify(sessionData));
            
            showToast('设置已保存', 'success');
            setTimeout(() => location.reload(), 1000);
        }
        
        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
